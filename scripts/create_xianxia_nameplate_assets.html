<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>XIANXIA NAMEPLATE ASSET GENERATOR</title>
  <style>
    body {
      background: transparent;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }
    .asset-box {
      display: inline-block;
      position: relative;
    }
  </style>
</head>
<body>

  <!-- HERO MASTER NAMEPLATE (920 x 160 px for 2x crisp rendering) -->
  <div id="hero-nameplate" class="asset-box">
    <svg width="920" height="160" viewBox="0 0 460 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Gold Metallic Gradient -->
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFE57F"/>
          <stop offset="25%" stop-color="#F59E0B"/>
          <stop offset="50%" stop-color="#FFF3B0"/>
          <stop offset="75%" stop-color="#D97706"/>
          <stop offset="100%" stop-color="#B45309"/>
        </linearGradient>

        <!-- Inner Cyan Glow Gradient -->
        <linearGradient id="innerCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="rgba(0,240,255,0.1)"/>
          <stop offset="50%" stop-color="rgba(0,240,255,0.7)"/>
          <stop offset="100%" stop-color="rgba(0,240,255,0.1)"/>
        </linearGradient>

        <!-- Plaque Body Dark Gradient -->
        <linearGradient id="bodyDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgba(15,23,42,0.96)"/>
          <stop offset="50%" stop-color="rgba(6,10,22,0.94)"/>
          <stop offset="100%" stop-color="rgba(2,6,15,0.98)"/>
        </linearGradient>

        <!-- Drop Shadow Filter -->
        <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
        </filter>
        <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="blur"/>
          <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
      </defs>

      <!-- Outer Shadow & Plaque Body -->
      <g filter="url(#heroShadow)">
        <!-- Main Plaque Geometry: Chamfered Swallowtail Tablet -->
        <path d="M 60,14 
                 L 400,14 
                 L 418,26 
                 L 444,40 
                 L 418,54 
                 L 400,66 
                 L 60,66 
                 L 42,54 
                 L 16,40 
                 L 42,26 Z" 
              fill="url(#bodyDarkGrad)" 
              stroke="url(#goldGrad)" 
              stroke-width="2.2" />

        <!-- Inner Engraved Line -->
        <path d="M 68,20 
                 L 392,20 
                 L 408,30 
                 L 428,40 
                 L 408,50 
                 L 392,60 
                 L 68,60 
                 L 52,50 
                 L 32,40 
                 L 52,30 Z" 
              fill="none" 
              stroke="rgba(245,158,11,0.4)" 
              stroke-width="1.2" 
              stroke-dasharray="8 3" />

        <!-- Cyan Energy Inlay Baseline -->
        <path d="M 80,63 L 380,63" stroke="url(#innerCyanGrad)" stroke-width="2" />
        <path d="M 80,17 L 380,17" stroke="url(#innerCyanGrad)" stroke-width="1.2" />
      </g>

      <!-- LEFT ORNATE CLOUD / DRAGON WING FILIGREE -->
      <g filter="url(#goldGlow)">
        <!-- Outer Wing Flange -->
        <path d="M 44,24 
                 C 32,16 14,18 8,28 
                 C 2,36 10,48 2,56 
                 C 12,54 22,60 36,54
                 C 26,48 24,36 38,32 Z" 
              fill="url(#goldGrad)" />
        <!-- Cloud Curl Left -->
        <path d="M 22,38 C 18,34 20,28 26,28 C 30,28 34,32 30,36 C 26,40 22,40 20,44 C 18,48 24,50 28,48" 
              fill="none" stroke="#FFF" stroke-width="1.2" stroke-linecap="round" />
        <!-- Left Jewel Stud -->
        <circle cx="44" cy="40" r="3.5" fill="#00F0FF" stroke="url(#goldGrad)" stroke-width="1.2" />
      </g>

      <!-- RIGHT ORNATE CLOUD / DRAGON WING FILIGREE -->
      <g filter="url(#goldGlow)">
        <!-- Outer Wing Flange -->
        <path d="M 416,24 
                 C 428,16 446,18 452,28 
                 C 458,36 450,48 458,56 
                 C 448,54 438,60 424,54
                 C 434,48 436,36 422,32 Z" 
              fill="url(#goldGrad)" />
        <!-- Cloud Curl Right -->
        <path d="M 438,38 C 442,34 440,28 434,28 C 430,28 426,32 430,36 C 434,40 438,40 440,44 C 442,48 436,50 432,48" 
              fill="none" stroke="#FFF" stroke-width="1.2" stroke-linecap="round" />
        <!-- Right Jewel Stud -->
        <circle cx="416" cy="40" r="3.5" fill="#00F0FF" stroke="url(#goldGrad)" stroke-width="1.2" />
      </g>

      <!-- TOP CREST: DAOIST JADE LOTUS RHOMBUS -->
      <g filter="url(#goldGlow)">
        <!-- Diamond Jewel Crest -->
        <path d="M 230,5 L 240,14 L 230,23 L 220,14 Z" fill="url(#goldGrad)" stroke="#FFF" stroke-width="1" />
        <circle cx="230" cy="14" r="3" fill="#00F0FF" />
        <!-- Flanking Winglets -->
        <path d="M 216,14 C 206,10 196,16 186,14" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
        <path d="M 244,14 C 254,10 264,16 274,14" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- BOTTOM CENTER ACCENT KNOT -->
      <g>
        <path d="M 224,66 L 230,73 L 236,66 Z" fill="url(#goldGrad)" />
        <circle cx="230" cy="74.5" r="2" fill="#F59E0B" />
        <path d="M 214,66 C 206,68 198,66 190,66" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
        <path d="M 246,66 C 254,68 262,66 270,66" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" />
      </g>
    </svg>
  </div>


  <!-- PEER PLAYER NAMEPLATE (640 x 128 px for 2x crisp rendering) -->
  <div id="player-nameplate" class="asset-box">
    <svg width="640" height="128" viewBox="0 0 320 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Antique Bronze & Gold Gradient -->
        <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FCD34D"/>
          <stop offset="40%" stop-color="#D97706"/>
          <stop offset="70%" stop-color="#F59E0B"/>
          <stop offset="100%" stop-color="#92400E"/>
        </linearGradient>

        <!-- Plaque Body Dark Indigo Gradient -->
        <linearGradient id="playerDarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="rgba(15,23,42,0.95)"/>
          <stop offset="100%" stop-color="rgba(4,8,20,0.96)"/>
        </linearGradient>

        <filter id="playerShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.75"/>
        </filter>
      </defs>

      <!-- Plaque Body -->
      <g filter="url(#playerShadow)">
        <!-- Chamfered Tablet -->
        <path d="M 38,12 
                 L 282,12 
                 L 296,22 
                 L 310,32 
                 L 296,42 
                 L 282,52 
                 L 38,52 
                 L 24,42 
                 L 10,32 
                 L 24,22 Z" 
              fill="url(#playerDarkGrad)" 
              stroke="url(#bronzeGrad)" 
              stroke-width="1.8" />

        <!-- Inner Subtle Border -->
        <path d="M 44,16 L 276,16 L 288,24 L 298,32 L 288,40 L 276,48 L 44,48 L 32,40 L 22,32 L 32,24 Z" 
              fill="none" 
              stroke="rgba(245,158,11,0.3)" 
              stroke-width="1" />
      </g>

      <!-- LEFT CLOUD CORNER BRACKET -->
      <g>
        <path d="M 26,20 C 18,16 10,22 8,28 C 6,34 14,40 8,44 C 16,46 24,42 26,38 Z" 
              fill="url(#bronzeGrad)" />
        <circle cx="28" cy="32" r="2.5" fill="#FDE68A" />
      </g>

      <!-- RIGHT CLOUD CORNER BRACKET -->
      <g>
        <path d="M 294,20 C 302,16 310,22 312,28 C 314,34 306,40 312,44 C 304,46 296,42 294,38 Z" 
              fill="url(#bronzeGrad)" />
        <circle cx="292" cy="32" r="2.5" fill="#FDE68A" />
      </g>

      <!-- TOP MINI RHOMBUS -->
      <path d="M 160,7 L 165,12 L 160,17 L 155,12 Z" fill="url(#bronzeGrad)" />
      <!-- BOTTOM MINI NOTCH -->
      <path d="M 156,52 L 160,56 L 164,52 Z" fill="url(#bronzeGrad)" />
    </svg>
  </div>

</body>
</html>
